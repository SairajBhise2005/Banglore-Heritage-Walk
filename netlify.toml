# Only public/ is served. node_modules and the test file stay off the live site;
# the function still bundles ../../valid-teams.mjs from the repo root.
[build]
  publish = "public"
  functions = "netlify/functions"

# Serve the handbook at the site root too. status 200 = rewrite, not a redirect,
# so the original /bengaluru-heritage-walk.html link keeps working unchanged.
[[redirects]]
  from = "/"
  to = "/bengaluru-heritage-walk.html"
  status = 200
